[phases.setup]
nixPkgs = ['python312', 'python312Packages.pip', 'python312Packages.virtualenv']

[phases.install]
cmds = [
  'python -m venv /opt/venv',
  '/opt/venv/bin/pip install -r requirements.txt',
]

[variables]
PATH = '/opt/venv/bin:$PATH'

[start]
cmd = 'gunicorn app:app --bind 0.0.0.0:$PORT'
